<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="styles.css" />
<style>
  html,body{margin:0;height:100%}
  body{width:1280px;height:854px;display:flex;overflow:hidden;font-family:var(--font-display,sans-serif)}
  .main{flex:0 0 75%;background:var(--color-gravity,#7E6CF0);display:flex;align-items:center;justify-content:center}
  .main img{width:46%;height:auto;display:block;filter:drop-shadow(0 18px 30px rgba(60,44,24,0.32))}
  .strip{flex:1;display:flex;flex-direction:column}
  .strip span{flex:1;display:block}
</style>
</head>
<body>
  <div class="main"><img src="08-brand/mark.png" alt="Gravity Jelly" /></div>
  <div class="strip">
    <span style="background:#FFE3A3"></span>
    <span style="background:#A3E5D9"></span>
    <span style="background:#F7A9C0"></span>
    <span style="background:#B3C7F7"></span>
  </div>
</body>
</html>
